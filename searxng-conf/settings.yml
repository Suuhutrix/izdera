# ─────────────────────────────────────────────────────────────────────────────
# İzdera — Özel SearXNG Yapılandırması
# JSON çıktısı açık, hız sınırı kapalı, optimize motor havuzu.
# ─────────────────────────────────────────────────────────────────────────────

use_default_settings: true

general:
  debug: false
  instance_name: "İzdera Meta-Search Engine"

search:
  safe_search: 1
  autocomplete: "wikipedia"
  default_lang: "tr-TR"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "izdera-searxng-default-secret-change-in-prod"
  limiter: false
  public_instance: false
  image_proxy: false

ui:
  default_locale: "tr"
  query_in_title: false
  infinite_scroll: false
  center_alignment: true

outgoing:
  request_timeout: 4.5
  max_request_timeout: 8.0
  enable_http2: true

# Arama motorlarını veri merkezi IP'lerine göre optimize et:
engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false
  - name: google cse
    engine: google_cse
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
