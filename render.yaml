# ─────────────────────────────────────────────────────────────────────────────
# Render.com Ücretsiz (0 TL) Tek Tıkla SearXNG Kurulum Şablonu (Blueprint)
# Kullanım: Render Dashboard → New → Blueprint → Bu GitHub deposunu seçin.
# Size verilen https://izdera-searxng-xxxx.onrender.com adresini
# Vercel'de SEARXNG_INSTANCES ortam değişkenine yapıştırın.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: izdera-searxng
    runtime: docker
    dockerfilePath: ./searxng/Dockerfile
    dockerContext: ./searxng
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: SEARXNG_SECRET
        generateValue: true
      - key: BIND_ADDRESS
        value: 0.0.0.0:8080
      - key: PORT
        value: "8080"

