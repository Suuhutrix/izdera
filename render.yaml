# ─────────────────────────────────────────────────────────────────────────────
# Render.com Ücretsiz (0 TL) Tek Tıkla SearXNG Kurulum Şablonu (Blueprint)
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: izdera-searxng
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: SEARXNG_SECRET
        generateValue: true
      - key: BIND_ADDRESS
        value: 0.0.0.0:8080
      - key: PORT
        value: "8080"
